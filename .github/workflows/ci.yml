name: Eve CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r eve/backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check eve/backend

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check eve/backend

      - name: Run MyPy Type Check
        run: |
          mypy eve/backend/app

      - name: Run Pytest Suite
        run: |
          cd eve/backend && pytest tests -v --cov=app --cov-report=term-missing

  frontend-quality:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'eve/frontend/package.json'

      - name: Install Dependencies
        run: |
          cd eve/frontend && npm ci

      - name: Build Next.js Application
        run: |
          cd eve/frontend && npm run build
